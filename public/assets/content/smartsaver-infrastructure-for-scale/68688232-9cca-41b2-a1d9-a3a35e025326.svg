ke-width="1.5"/><text x="1100" y="170" fill="#6b7a95" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="middle">GROWTH</text><text x="1100" y="236" fill="#246edf" font-family="Arial,Helvetica,sans-serif" font-size="53" font-weight="700" text-anchor="middle">2</text><text x="1100" y="266" fill="#506b91" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="middle">at launch</text><text x="1100" y="330" fill="#8aa5ca" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="400" text-anchor="middle">↓</text><text x="1100" y="406" fill="#098b68" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700" text-anchor="middle">~40</text><text x="1100" y="437" fill="#506b91" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="middle">at departure</text><rect x="35" y="550" width="1130" height="135" rx="14" fill="#f8faff" stroke="#dbe5f3" stroke-width="1.5"/><text x="60" y="585" fill="#193153" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start">Self-service administration</text><text x="60" y="619" fill="#193153" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="start">Create or edit templates</text><text x="60" y="645" fill="#61728c" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">in minutes</text><text x="415" y="619" fill="#193153" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="start">Assign accounts individually</text><text x="415" y="645" fill="#61728c" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">or in bulk</text><text x="810" y="619" fill="#193153" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="start">Default and custom templates</text><text x="810" y="645" fill="#61728c" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">for different business needs</text></svg>