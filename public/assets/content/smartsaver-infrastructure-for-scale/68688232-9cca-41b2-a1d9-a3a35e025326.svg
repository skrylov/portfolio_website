<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><text x="600" y="55" fill="#112247" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" text-anchor="middle">SmartSaver Account Templates</text><text x="600" y="88" fill="#61728c" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="middle">A configurable foundation for financial conditions and product features</text><rect x="35" y="135" width="340" height="112" rx="14" fill="#eef5ff" stroke="#dbe5f3" stroke-width="1.5"/><text x="55" y="171" fill="#193153" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="start">APY and bonus rates</text><text x="55" y="198" fill="#64738e" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Rates tailored by customer group</text><rect x="35" y="270" width="340" height="112" rx="14" fill="#edfbf5" stroke="#dbe5f3" stroke-width="1.5"/><text x="55" y="306" fill="#193153" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="start">Referral permissions</text><text x="55" y="333" fill="#64738e" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Partner-specific feature eligibility</text><rect x="35" y="405" width="340" height="112" rx="14" fill="#f7f1ff" stroke="#dbe5f3" stroke-width="1.5"/><text x="55" y="441" fill="#193153" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="start">Withdrawal rules</text><text x="55" y="468" fill="#64738e" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Limits, schedules and availability</text><rect x="755" y="135" width="260" height="112" rx="14" fill="#fff8ea" stroke="#dbe5f3" stroke-width="1.5"/><text x="775" y="171" fill="#193153" font-family="Arial,Helvetica,sans-serif" font-size