<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580"><rect width="1000" height="580" rx="18" fill="#ffffff"/><text x="500" y="63" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#111d40">Before Account Templates</text><text x="500" y="95" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#60708b">Financial and eligibility rules were scattered across application code</text><g font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#102046"><rect x="32" y="130" width="450" height="150" rx="18" fill="#eef5ff" stroke="#cbdffd"/><text x="62" y="175">Partner-specific restrictions</text><text x="62" y="210" font-size="15" font-weight="400" fill="#576783">Some customers were not allowed to refer friends.</text><rect x="518" y="130" width="450" height="150" rx="18" fill="#edfcf4" stroke="#cbe9d9"/><text x="548" y="175">Different rates and bonuses</text><text x="548" y="210" font-size="15" font-weight="400" fill="#576783">Different customer groups needed different terms.</text><rect x="32" y="300" width="450" height="150" rx="18" fill="#fff7ea" stroke="#f6e0bd"/><text x="62" y="345">Hardcoded conditions</text><text x="62" y="380" font-size="15" font-weight="400" fill="#576783">Even routine updates required engineering effort.</text><rect x="518" y="300" width="450" height="150" rx="18" fill="#fff0f3" stroke="#f5d1d8"/><text x="548" y="345">Risk of incorrect behavior</text><text x="548" y="380" font-size="15" font-weight="400" fill="#576783">Wrong rates or access could reach real customers.</text></g><rect x="32" y="480" width="936" height="70" rx="16" fill="#f4f6fb"/><text x="500" y="523" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#394968">Slow changes  •  manual coordination  •  growing complexity</text></svg>